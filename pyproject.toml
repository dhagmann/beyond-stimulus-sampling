[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "beyond-stimulus-sampling"
version = "0.1.0"
description = "Guided construction and auditing of experimental messages"
requires-python = ">=3.10"
authors = [{name = "David Hagmann"}, {name = "Zachary Wojtowicz"}]
dependencies = []

[project.scripts]
bss = "beyond_stimulus_sampling.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
beyond_stimulus_sampling = ["data/*.json"]
